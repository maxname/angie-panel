# Runtime directory for angie-panel's ACME collector unix sockets.
# Angie's (root) master creates one socket per certificate here; the
# directory must exist before a reload binds them. systemd-tmpfiles creates
# it on boot; on package install the maintainer script applies this file
# explicitly (packaging/debian/postinst) — no dpkg trigger does it for us.
d /run/angie-panel 0755 root root -

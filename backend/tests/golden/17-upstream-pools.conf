# app backends
upstream pool_3 {
    zone pool_3 64k;
    least_conn;
    server 10.0.0.2:8080 weight=3 max_fails=2 fail_timeout=20s;
    server 10.0.0.3:8080 max_fails=2 fail_timeout=20s backup;
    server app.internal:9000 max_fails=2 fail_timeout=20s down;
}

# api
upstream pool_5 {
    zone pool_5 64k;
    server 10.0.1.1:3000;
}
